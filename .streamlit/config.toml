[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkUnderline = false

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#2563EB"
borderColor = "#E2E8F0"
codeTextColor = "#1E293B"
grayColor = "#64748B"
blueColor = "#2563EB"
greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#CA8A04"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
chartCategoricalColors = ["#2563EB", "#16A34A", "#F59E0B", "#8B5CF6", "#06B6D4"]
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111827"
codeBackgroundColor = "#1F2937"
textColor = "#F9FAFB"
linkColor = "#60A5FA"
borderColor = "#1F2937"
codeTextColor = "#F3F4F6"
grayColor = "#9CA3AF"
blueColor = "#3B82F6"
greenColor = "#22C55E"
redColor = "#EF4444"
yellowColor = "#EAB308"
orangeColor = "#F97316"
violetColor = "#A855F7"
chartCategoricalColors = ["#3B82F6", "#22C55E", "#FBBF24", "#A855F7", "#38BDF8"]
dataframeBorderColor = "#1F2937"
dataframeHeaderBackgroundColor = "#111827"
dataframeHeaderTextColor = "#F9FAFB"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false
